server:
  port: 80


spring:
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://${MYSQL_ADDRESS}/${MYSQL_DATABASE:springboot_demo}?useUnicode=true&characterEncoding=utf8&useSSL=false
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    # 云托管部署加固：数据库短暂不可达时不直接打挂应用，让探针通过、错误可诊断
    hikari:
      initialization-fail-timeout: -1
  mvc:
    view:
      suffix: .html
      prefix: /

mybatis:
  mapper-locations: classpath*:mapper/*Mapper.xml

# ------- 业务配置（可被环境变量覆盖，微信云托管用环境变量注入） -------
app:
  wx:
    appid: ${WX_APPID:}            # 小程序 appid
    secret: ${WX_SECRET:}          # 小程序 secret（不建议入库，放环境变量）
  jwt:
    secret: ${JWT_SECRET:study-room-dev-secret-change-me-please}
    expire-hours: ${JWT_EXPIRE_HOURS:168}   # token 有效期，默认 7 天
  mqtt:
    broker-url: ${EMQX_BROKER_URL:tcp://f1e96469.ala.cn-hangzhou.emqxsl.cn:1883}
    username:   ${EMQX_USERNAME:}
    password:   ${EMQX_PASSWORD:}
    client-id:  ${EMQX_CLIENT_ID:study-room-back-${random.uuid}}   # 带随机后缀，多实例不冲突
    topic-prefix: ${EMQX_TOPIC_PREFIX:study-room}   # 所有主题前面加这个前缀
    connect-timeout: 10    # 连接超时秒
    keep-alive: 60          # 心跳秒
    automatic-reconnect: true
    clean-session: true
    enabled: ${EMQX_ENABLED:true}   # 本地调试想禁用设 false

# 日志
logging:
  pattern:
    console: '%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'